# ==========================================
#         LancerCore Configuration
# ==========================================

prefix: "&8[&bLancerCore&8] "

# ------------------------------------------
# Combat Mechanics
# ------------------------------------------
combat:
  damage-multiplier: 1.5
  mount-bonus-multiplier: 2.0
  lunge-hunger-cost: 2
  
  # Bleeding Effect 
  bleeding:
    enabled: true
    chance: 0.25         # 25% chance to trigger per hit
    duration-seconds: 3  # How long it lasts
    damage-per-second: 1.0 # 1.0 = half heart
  
  # Ghost Reach 
  ghost-reach:
    enabled: true
    min-combo-required: 10
    range: 7.0           # Max distance in blocks
    damage: 6.0          # Flat damage dealt

# ========================================== #
#           GRAPPLING TRIDENT SYSTEM         #
# ========================================== #
grappling-trident:
  enabled: true
  require-lead-in-offhand: true
  cooldown-seconds: 5
  fall-immunity-seconds: 8
  pull-speed-multiplier: 1.8
  
  ranges:
    base: 15
    unbreaking-1: 25
    unbreaking-2: 35
    unbreaking-3: 50
    
  messages:
    out-of-range: "&c&lTarget too far! &8(Max: {max}m)"
    on-cooldown: "&e&lGrapple on cooldown! &8({time}s)"
    anchored: "&a&lAnchored! &7Right-click to pull."
    
# ------------------------------------------
# Combo System
# ------------------------------------------
combo:
  enabled: true
  reset-time-seconds: 5
  
  sounds:
    enabled: true
    hit-sound: "BLOCK_NOTE_BLOCK_PLING"
    base-pitch: 1.0
    pitch-increase: 0.1
    
  finisher:
    enabled: true
    sound: "ENTITY_WITHER_SPAWN"
    min-combo-trigger: 5
    
    rewards:
      enabled: true
      commands:
        - "cmi pay %player% 50"
        - "minecraft:tellraw %player% [\"\",{\"text\":\"[LancerCore] \",\"color\":\"gray\"},{\"text\":\"Legendary Kill! Reward sent.\",\"color\":\"gold\"}]"

# ------------------------------------------
# Visual Effects
# ------------------------------------------
visuals:
  action-bar: true
  combo-message: "&6&lLANCE COMBO &e&lx{combo}"
  
  lightning:
    enabled: true
    trigger-interval: 5
  
  particles:
    enabled: true
    style: "HELIX"
    default-type: "SOUL_FIRE_FLAME" 
    min-combo-trigger: 3
    radius: 1.2

# ------------------------------------------
# Off-hand Catalysts System
# ------------------------------------------
catalysts:
  enabled: true

  # ==================== ORIGINAL CATALYSTS ====================

  snowball:
    enabled: true
    consume-item: true
    freeze-ticks: 140
    slowness-duration: 3
    slowness-amplifier: 1
    
  slimeball:
    enabled: true
    consume-item: true
    slowness-duration: 2
    slowness-amplifier: 3

  gunpowder:
    enabled: true
    consume-item: true
    knockback-strength: 1.5
    extra-damage: 2.0

  spider-eye:
    enabled: true
    consume-item: true
    duration: 4
    amplifier: 0

  rotten-flesh:
    enabled: true
    consume-item: true
    duration: 5
    amplifier: 4

  feather:
    enabled: true
    consume-item: true
    duration: 1
    amplifier: 9

  amethyst-shard:
    enabled: true
    consume-item: true
    duration: 6
    amplifier: 0

  echo-shard:
    enabled: true
    consume-item: true
    duration: 5
    amplifier: 0
  
  pufferfish:
    enabled: true
    consume-item: true
    duration: 2
    
  ghast-tear:
    enabled: true
    consume-item: true
    duration: 3
    amplifier: 1

  chorus-fruit:
    enabled: true
    consume-item: true
    range: 5.0

  cobweb:
    enabled: true
    consume-item: true
    remove-after-seconds: 3

  wither-skeleton-skull:
    enabled: true
    consume-item: true
    lifespan-seconds: 6

  # ==================== NEW CATALYSTS ====================

  # Name Tag → Marked: Reveals target globally with red name
  name-tag:
    enabled: true
    consume-item: true
    duration-seconds: 15  # How long the name stays visible

  # Magma Cream → Lava Trail: Target leaves fire trail while moving
  magma-cream:
    enabled: true
    consume-item: true
    duration-seconds: 4  # How long they leave fire behind

  # Nether Star → Gravity Well: Pulls all nearby enemies toward target
  nether-star:
    enabled: true
    consume-item: true
    radius: 8.0           # Area of effect
    duration-seconds: 2   # How long the pull lasts

  # Totem of Undying → False Death: Fake your death with invisibility + invulnerability
  totem:
    enabled: true
    consume-item: false   # Totems are rare, maybe don't consume
    duration-seconds: 2   # Invisibility + invulnerability time
    cooldown-seconds: 60  # Long cooldown to prevent spam

  # Heart of the Sea → Tidal Pull: Yanks target toward you
  heart-of-the-sea:
    enabled: true
    consume-item: true
    pull-strength: 2.0    # Velocity multiplier

  # ====================  DAMAGE REFLECTION ====================

  # Prismarine Shard → Mirror Shield: Reflects next attack from target back to them
  prismarine-shard:
    enabled: true
    consume-item: true
    duration-seconds: 5   # How long the shield lasts

  # Prismarine Crystals → Refraction: Redistributes % of damage received back to target
  prismarine-crystals:
    enabled: true
    consume-item: true
    duration-seconds: 4
    reflect-percentage: 0.4  # 40% of damage received is reflected

  # Nether Wart → Blood Curse: Target damages themselves when they hit you
  nether-wart:
    enabled: true
    consume-item: true
    duration-seconds: 4   # How long the curse lasts

storage:
  type: "SQLITE"